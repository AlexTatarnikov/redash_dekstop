name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS: matches the development platform, and the snapshot tests render with Metal.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned version with clippy/rustfmt.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: tests/snapshots/*.new.png
          if-no-files-found: ignore
